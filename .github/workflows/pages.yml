name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/quirky-darwin-ize34m]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build version is the commit count.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compile levels
        run: npm run level:build
      - name: Build for project pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Build the development variant under /dev/
        run: npm run build:dev
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Secrets guard on build output
        run: npm run secrets:guard -- --dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
