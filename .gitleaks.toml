# gitleaks configuration: default rules plus project-specific ones.
[extend]
useDefault = true

[[rules]]
id = "meshy-api-key"
description = "Meshy API key"
regex = '''msy_[A-Za-z0-9]{20,}'''
tags = ["key", "meshy"]

[[rules]]
id = "freesound-api-key"
description = "Freesound API key assignment"
regex = '''(?i)freesound[_-]?api[_-]?key\s*[:=]\s*['"]?[A-Za-z0-9]{24,}'''
tags = ["key", "freesound"]

[allowlist]
paths = [
  '''package-lock\.json''',
  '''artwork/''',
  '''assets/''',
]
